<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Textos en HTML - Parte 2</title>
</head>
<body>
    <!-- str+br+b{Letra negrita en la etiqueta}+hr+em{Tipo de letra cursiva con la etiqueta em}+br+i{Tipo de letra cursiva con la etiqueta i}+hr+u{Tipo de letra subrayada con la etiqueta u}+hr+br+s{Tipo de letra tachada con la etiqueta s}+br+del{Tipo de letra tachada en la etiqueta del}+hr+mark{Tipo de letra resaltada con la etiqueta mark} -->
    <strong></strong><br><b>Letra negrita en la etiqueta</b>
    <hr>
    <em>Tipo de letra cursiva con la etiqueta em</em><br><i>Tipo de letra cursiva con la etiqueta i</i>
    <hr>
    <u>Tipo de letra subrayada con la etiqueta u</u>
    <hr>
    <br><s>Tipo de letra tachada con la etiqueta s</s><br><del>Tipo de letra tachada en la etiqueta del</del>
    <hr>
    <mark>Tipo de letra resaltada con la etiqueta mark</mark>
</body>
</html>
