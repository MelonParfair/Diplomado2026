<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas Básicas</title>
</head>
<body>
    <!-- Emmet: h2{Tabla Básica}^table[border]>tr>th[colspan="3"]>{Curso de HTML y CSS}^^tr>th{Módulo}+th{Clase}+th{Duración}^tr>td{Bienvenida}+td{Instrucciones Iniciales}+td{00:01:50}^tr>td[rowspan="3"]>{Instalación de Software}+td{Instalación de XAMPP}+td{00:05:50}^^tr>td{Instalación de Visual Studio Code}+td{00:07:50}^tr>td{Instalación de Complementos para Visual Studio Code}+td{00:10:50} -->
    <h2>Tabla Básica</h2>
    <table border="">
        <tr>
            <th colspan="3">Curso de HTML y CSS</th>
        </tr>
        <tr>
            <th>Módulo</th>
            <th>Clase</th>
            <th>Duración</th>
        </tr>
        <tr>
            <td>Bienvenida</td>
            <td>Instrucciones Iniciales</td>
            <td>00:01:50</td>
        </tr>
        <tr>
            <td rowspan="3"> <!-- Nos permite indicar cuántas filas abarcarán la celda -->
                Instalación de Software
                <td>Instalación de XAMPP</td>
                <td>00:05:50</td>
            </td>
        </tr>
        <tr>
            <td>Instalación de Visual Studio Code</td>
            <td>00:07:50</td>
        </tr>
        <tr>
            <td>Instalación de Complementos para Visual Studio Code</td>
            <td>00:10:50</td>
        </tr>
    </table>
</body>
</html>
