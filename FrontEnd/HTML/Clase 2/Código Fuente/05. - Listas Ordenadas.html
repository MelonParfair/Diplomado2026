<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas Ordenadas</title>
</head>
<body>
    <ol reversed="reversed" start="8" type="I">
        <!-- Emmet: ol[reversed start=""][type=""]>li{Enero}+li{Febrero}+li{Marzo}+li{Abril}+li{Mayo} -->

        <!-- type:
        1 Listas Decimales
        a Listas Alfabéticas
        A Listas Alfabéticas
        i Listas Romanas
        I Listas en Romanas -->
        <li>Enero</li>
        <li>Febrero</li>
        <li>Marzo</li>
        <li>Abril</li>
        <li>Mayo</li>
    </ol>
</body>
