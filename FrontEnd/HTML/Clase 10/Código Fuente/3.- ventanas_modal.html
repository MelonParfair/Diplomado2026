<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/css/bootstrap.min.css">
    <title>Ventana Modal</title>
</head>
<body>
    <div class="container">
        <!-- 1.- BOTÓN QUE DISPARA LA MODAL  -->
        <!-- data-bs-target debe apuntar exactamente al id de la modal  -->
        <button type="button" class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#modalEliminar">Eliminar Registro</button>

        <!-- 2.- LA ESTRUCTURA DE LA MODAL  -->
        <div class="modal fade" id="modalEliminar" tabindex="-1" aria-labelledby="tituloModal" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <!-- ENCABEZADO  -->
                    <div class="modal-header">
                        <h5 class="modal-title fw-bold text-danger" id="tituloModal">Confirmar Eliminación</h5>
                        <!-- Botón de la X para cerrar  -->
                        <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <!-- CUERPO  -->
                    <div class="modal-body">
                        <p>¿Estás seguro que deseas eliminar los datos de este estudiante de la base de datos local? Esta acción no se puede revertir.</p>
                    </div>
                    <!-- PIE DE PÁGINA  -->
                    <div class="modal-header modal-footer border-0">
                        <!-- data-bs-dismiss="modal" hace que el botón cierre la ventana automáticamente  -->
                        <button class="btn btn-secondary" type="button" data-bs-dismiss="modal">Cancelar</button>
                        <button class="btn btn-danger" type="button">Sí, Confirmar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="../JS/js/bootstrap.bundle.min.js"></script>
</body>
</html>
