<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/css/bootstrap.min.css">
    <title>Botones</title>
</head>
<body>
    <div class="container">
        <div class="row mt-3">
            <div class="col-12 m-4">
                <input type="button" class="btn btn-warning" value="input">
                <input type="submit" class="btn btn-dark" value="submit">
                <button class="btn btn-sm btn-primary">Botón</button>
                <button class="btn btn-md btn-outline-danger">Botón</button>
                <button class="btn btn-lg disabled btn-info">Botón</button>
            </div>
            <hr>
            <div class="col-12 m-4">
                <div class="btn-group">
                    <button class="btn btn-success">Botón</button>
                    <button class="btn btn-success">Botón</button>
                    <button class="btn btn-success">Botón</button>
                    <button class="btn btn-success">Botón</button>
                </div>
            </div>

            <div class="col-12 m-4">
                <div class="btn-group-vertical">
                    <button class="btn btn-danger">Botón</button>
                    <button class="btn btn-danger">Botón</button>
                    <button class="btn btn-danger">Botón</button>
                    <button class="btn btn-danger">Botón</button>
                </div>
            </div>

            <div class="col-12 m-4">
                <div class="btn-group-vertical">
                    <button type="button" class="btn btn-outline-primary">Borde Azul</button>
                    <button type="button" class="btn btn-outline-success">Borde Verde</button>
                    <button type="button" class="btn btn-outline-danger">Borde Rojo</button>
                </div>
            </div>

            <div class="col-12">
                <!-- Para etiquetas <button> -->
                    <button class="btn btn-primary" type="button" disabled>No me puedes presionar.</button>
                
                <!-- Para enlaces <a> (Como los enlaces no permiten "disabled", Bootstrap te da una clase.) -->
                <a href="#" class="btn btn-primary disabled" tabindex="-1" aria-disabled="true">Enlace Deshabilitado.</a>
            </div>
        </div>
    </div>
    <script src="../JS/js/bootstrap.bundle.min.js"></script>
</body>
</html>
